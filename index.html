<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantress Labs</title>
<style>
:root { --bg: #FAF6EC; --ink: #0D1B2A; --muted: #5E5A52; }
@media (prefers-color-scheme: dark) { :root { --bg: #0D1B2A; --ink: #FAF6EC; --muted: #C9BFA8; } }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
h1 { font-size: clamp(36px, 8vw, 64px); font-weight: 700; letter-spacing: -0.03em; }
p { margin-top: 10px; font-size: 17px; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Vantress Labs</h1>
<p>Coming soon.</p>
</main>
</body>
</html>
